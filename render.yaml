services:
  - type: web
    name: backend-caudal
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "True"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: backend-caudal.onrender.com
      - key: CAUDAL_MAX_LPM
        value: "30"
      - key: IOT_DISCONNECT_SECONDS
        value: "10"
